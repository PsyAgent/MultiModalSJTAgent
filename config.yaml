# ==========================================================================
# 模型与接口统一配置
# API 密钥仍放在 .env（OPENAI_API_KEY / OPENAI_BASE_URL），此文件只放非敏感设置。
# 可用模型列表可通过 GET {base_url}/models 查询。
# ==========================================================================

# DMXAPI 网关地址（视频、TTS 直连接口用；LLM 客户端走 .env 的 OPENAI_BASE_URL）
base_url: https://www.dmxapi.cn/v1

# 文本 SJT 生成
text:
  model: gpt-5-mini

# 图像 SJT 生成
image:
  llm_model: gpt-5-mini            # 流水线中的文本推理模型
  image_model: gpt-image-1.5       # 文生图/图生图模型（generate 与 edit 均实测可用）
  # 备选：gpt-image-2
  # 注意：gpt-image-1 及 gpt-image-1-dmx00~03 在 DMXAPI 均已无可用渠道（实测报错），勿用

# 视频 SJT 生成
video:
  agent_model: gpt-5-mini          # LangGraph 多智能体使用的 LLM
  video_model: MiniMax-Hailuo-02   # 视频生成模型（备选：MiniMax-Hailuo-2.3 / -2.3-Fast）
  duration: 10                     # 时长（秒）
  resolution: 768P
  recursion_limit: 60              # LangGraph 单次运行的最大步数（默认 25 太小，反思循环容易撞上限）
  agent_attempts: 2                # 多智能体阶段（不含实际出片）失败后的最大尝试次数

# 旁白语音合成
tts:
  model: gpt-4o-mini-tts
  voice: alloy

# 失败重试（LLM 偶发不按格式输出 / 网络抖动时自动重来）
retry:
  step_attempts: 3   # 流水线内单步（一次 LLM 调用）最多尝试次数
  task_attempts: 2   # 整题生成失败后最多尝试次数（app 层，含首次）
  delay: 2           # 首次重试前等待秒数
  backoff: 2         # 每次重试等待时间的放大倍数
